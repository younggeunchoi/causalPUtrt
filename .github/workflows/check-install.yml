name: Check clean install

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check-install:
    name: Clean install test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'

      - name: Run one-sample example
        run: Rscript examples/example_onesample.R

      - name: Run two-sample example
        run: Rscript examples/example_twosample.R
